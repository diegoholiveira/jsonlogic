version: "2"
run:
  timeout: 5m
linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unparam
    - unused
    - whitespace
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/diegoholiveira/jsonlogic
